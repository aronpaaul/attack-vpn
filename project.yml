# Спека проекта для XcodeGen — из неё генерится AttackVPN.xcodeproj
name: AttackVPN
options:
  # префикс bundle id и общие настройки
  bundleIdPrefix: ru.paul
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 режим, чтобы strict concurrency Swift 6 не ломал сборку
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # 1 = iPhone, 2 = iPad — приложение универсальное
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
    INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
targets:
  AttackVPN:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.paul.attackvpn
        INFOPLIST_KEY_CFBundleDisplayName: "Attack VPN"
        # без подписи — .ipa подписывается отдельно вручную
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait"
# общая схема — нужна для сборки через xcodebuild -scheme в CI
schemes:
  AttackVPN:
    build:
      targets:
        AttackVPN: all
    run:
      config: Debug
    archive:
      config: Release
